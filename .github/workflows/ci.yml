name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, mysql, pdo_mysql, sqlite, pdo_sqlite, bcmath, gd, zip
          coverage: xdebug

      - name: Copy environment file
        run: cp .env.testing.example .env

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Generate application key
        run: php artisan key:generate

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --no-interaction --memory-limit=2G || true

      - name: Run tests
        run: php artisan test --parallel

      - name: Run Pint (code style check)
        run: vendor/bin/pint --test || true
